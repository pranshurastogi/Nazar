name: Pipeline

# Harvests regulator alerts on a schedule, extracts and resolves them, and
# publishes to Arkiv. Runs in dry-run unless the repository variable
# NAZAR_PUBLISH_MODE is "live" and the NAZAR_PUBLISHER_PRIVATE_KEY secret is set.
#
# The ledger lives in git (Nazar-backend/seed/nazar.sqlite): each run starts from it and commits it
# back when alerts or notices changed. That push redeploys the read API on Vercel, which ships the
# seed. GitHub's runners are in the US, where CDSCO refuses connections, so CDSCO documents are
# best harvested from a Mac or an Asian host (`pnpm cli run && pnpm seed:export`, then commit).
on:
  schedule:
    - cron: '17 */6 * * *' # every 6 hours (UTC)
  workflow_dispatch:
    inputs:
      source:
        description: 'Source id to run (blank = all enabled)'
        required: false
      since:
        description: 'Only documents from this YYYYMM onwards'
        required: false
        default: '202601'
      limit:
        description: 'Max documents per source'
        required: false
        default: '6'

permissions:
  contents: write

concurrency:
  group: nazar-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Nazar-backend
    env:
      NODE_ENV: production
      LOG_LEVEL: info
      NAZAR_PUBLISH_MODE: ${{ vars.NAZAR_PUBLISH_MODE || 'dry-run' }}
      NAZAR_PUBLISHER_PRIVATE_KEY: ${{ secrets.NAZAR_PUBLISHER_PRIVATE_KEY }}
      ARKIV_API_KEY: ${{ secrets.ARKIV_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NAZAR_HOST_DELAY_MS: '5000'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: Nazar-backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The raw store and OCR data are caches; restoring them avoids refetching documents we already hold.
      - uses: actions/cache@v6
        with:
          path: |
            Nazar-backend/data/raw
            Nazar-backend/data/tessdata
          key: nazar-raw-${{ github.run_id }}
          restore-keys: nazar-raw-
      - name: Start from the committed ledger
        run: mkdir -p data && cp seed/nazar.sqlite data/nazar.sqlite
      - name: Run pipeline
        run: |
          ARGS="--since ${{ inputs.since || '202601' }} --limit ${{ inputs.limit || '6' }}"
          if [ -n "${{ inputs.source }}" ]; then ARGS="$ARGS --source ${{ inputs.source }}"; fi
          if [ "$NAZAR_PUBLISH_MODE" = "live" ]; then ARGS="$ARGS --publish"; fi
          pnpm cli run $ARGS
      - name: Status
        if: always()
        run: pnpm cli status
      - name: Commit the ledger if alerts changed
        run: |
          pnpm seed:export --if-changed
          if git diff --quiet -- seed/nazar.sqlite; then
            echo "No change in alerts or notices."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seed/nazar.sqlite
          git commit -m "Pipeline: refresh the ledger seed"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
