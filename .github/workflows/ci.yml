name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Nazar-backend
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: Nazar-backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: Nazar-backend/coverage
          if-no-files-found: ignore

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Nazar-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: Nazar-frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:scan
      - run: pnpm build

  e2e:
    name: Frontend e2e (headless Chrome)
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: Nazar-frontend
    env:
      # Real Arkiv RPC, but a publisher with no entities: answers are deterministic (demo fallback / mocked API).
      NEXT_PUBLIC_NAZAR_PUBLISHER: '0x000000000000000000000000000000000000dEaD'
      # Production builds skip the API unless this is set; the suites refuse (fallback) or mock (mock) it over CDP.
      NEXT_PUBLIC_NAZAR_API_URL: 'http://localhost:8787'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: Nazar-frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-screenshots
          path: Nazar-frontend/e2e/screenshots
          if-no-files-found: ignore
