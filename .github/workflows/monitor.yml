name: Monitor

# Hourly check of the live read API on Vercel. A failing run makes GitHub email the repo owner.
# The API serves the ledger committed by the Pipeline workflow, so there is no worker heartbeat or
# egress check to watch here; a stale seed shows up as an old snapshot date instead.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API: ${{ vars.NAZAR_API_URL || 'https://nazar-api-seven.vercel.app' }}
    steps:
      - name: API is up
        run: curl -fsS --retry 3 --retry-delay 10 "$API/health" -o health.json && jq '{ok, mode, stats}' health.json
      - name: A batch check answers
        run: |
          curl -fsS "$API/v1/check?batch=SR-13" | jq -e '.state == "flagged"' > /dev/null || { echo "::error::SR-13 is no longer flagged"; exit 1; }
      - name: The snapshot is served
        run: |
          curl -fsS "$API/v1/snapshot" -o snapshot.json
          jq -e '.count > 1000' snapshot.json > /dev/null || { echo "::error::snapshot has $(jq .count snapshot.json) alerts"; exit 1; }
          jq '{count, generatedAt}' snapshot.json
